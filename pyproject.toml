[project]
name = "aichessathon-starter"
version = "0.1.0"
requires-python = "==3.12.*"
dependencies = [
    "chess==1.11.2",
    "numpy==2.5.2",
    "numba==0.67.0",
    "torch==2.13.0",
    "onnxruntime==1.29.0",
    "scipy>=1.18.1",
]

[tool.uv]
package = false

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[dependency-groups]
dev = ["mypy>=1.18", "ruff>=0.14"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]
ignore = ["N818"]

[tool.mypy]
strict = true
files = ["agent.py", "harness"]
# numba's njit is an untyped decorator, so under strict mode every compiled function in the
# engine would be reported as untyped no matter how it is annotated. Everything else strict
# mode checks still applies.
disallow_untyped_decorators = false

[[tool.mypy.overrides]]
module = ["numba", "numba.*"]
ignore_missing_imports = true
